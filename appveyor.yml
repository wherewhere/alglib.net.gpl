version: 3.16.0.{build}
pull_requests:
  do_not_increment_build_number: true
image: Visual Studio 2022
configuration: Release
before_build:
  - nuget restore
build:
  parallel: true
  verbosity: minimal
after_build:
  - cmd: msbuild /t:Pack /p:Configuration=Release /p:PackageOutputPath=../../nugets
artifacts:
  - path: "nugets/**"
    name: NuGet
